<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">Git and operations reflection cover</title>
  <desc id="desc">A calm abstract cover showing a timeline from SVN to GitOps and AI workflow.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.54" stop-color="#155e75"/>
      <stop offset="1" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="line" x1="0" x2="1">
      <stop offset="0" stop-color="#f97316"/>
      <stop offset="0.48" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>
  <rect width="1200" height="750" fill="url(#bg)"/>
  <circle cx="1010" cy="120" r="170" fill="#22c55e" opacity="0.13" filter="url(#soft)"/>
  <circle cx="190" cy="620" r="210" fill="#38bdf8" opacity="0.12" filter="url(#soft)"/>
  <g fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1">
    <path d="M120 150h960"/>
    <path d="M120 300h960"/>
    <path d="M120 450h960"/>
    <path d="M120 600h960"/>
    <path d="M240 90v570"/>
    <path d="M480 90v570"/>
    <path d="M720 90v570"/>
    <path d="M960 90v570"/>
  </g>
  <path d="M178 448 C 300 324, 386 520, 520 382 S 735 210, 902 330 S 1025 458, 1086 252" fill="none" stroke="url(#line)" stroke-width="12" stroke-linecap="round"/>
  <g fill="#0f172a" stroke="#ecfeff" stroke-width="8">
    <circle cx="178" cy="448" r="30"/>
    <circle cx="520" cy="382" r="30"/>
    <circle cx="902" cy="330" r="30"/>
    <circle cx="1086" cy="252" r="30"/>
  </g>
  <g font-family="Inter, Arial, sans-serif" font-weight="800" letter-spacing="0">
    <text x="110" y="170" fill="#ecfeff" font-size="76">SVN</text>
    <text x="366" y="286" fill="#ecfeff" font-size="76">Git</text>
    <text x="638" y="194" fill="#ecfeff" font-size="76">GitOps</text>
    <text x="860" y="538" fill="#ecfeff" font-size="76">AI Workflow</text>
  </g>
  <g fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" opacity="0.78">
    <text x="110" y="678">OpsKitPro Field Notes</text>
    <text x="110" y="720">整理过去的判断，变成今天可复用的工具</text>
  </g>
</svg>
