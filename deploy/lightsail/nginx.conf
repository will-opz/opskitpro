map $http_x_forwarded_proto $opskitpro_forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

# ── Cloudflare IP allowlist ────────────────────────────────────────────────────
# Only Cloudflare edge nodes should reach this origin.
# Update when Cloudflare publishes new ranges: https://www.cloudflare.com/ips-v4
geo $realip_remote_addr $cloudflare_ip {
    default          0;
    173.245.48.0/20  1;
    103.21.244.0/22  1;
    103.22.200.0/22  1;
    103.31.4.0/22    1;
    141.101.64.0/18  1;
    108.162.192.0/18 1;
    190.93.240.0/20  1;
    188.114.96.0/20  1;
    197.234.240.0/22 1;
    198.41.128.0/17  1;
    162.158.0.0/15   1;
    104.16.0.0/13    1;
    104.24.0.0/14    1;
    172.64.0.0/13    1;
    131.0.72.0/22    1;
    2400:cb00::/32   1;
    2606:4700::/32   1;
    2803:f800::/32   1;
    2405:b500::/32   1;
    2405:8100::/32   1;
    2a06:98c0::/29   1;
    2c0f:f248::/32   1;
    127.0.0.1/32     1;  # loopback for health checks
    ::1/128          1;
    172.26.0.0/16    1;  # Lightsail internal VPC
}

server {
    listen 80;
    server_name opskitpro.com www.opskitpro.com;

    # Block non-Cloudflare direct connections
    if ($cloudflare_ip = 0) {
        return 403;
    }

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host                              $host;
        proxy_set_header X-Forwarded-Host                 $host;
        proxy_set_header X-Real-IP                        $remote_addr;
        proxy_set_header X-Forwarded-For                  $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto                $opskitpro_forwarded_proto;
        proxy_set_header Upgrade                          $http_upgrade;
        proxy_set_header Connection                       "upgrade";
        proxy_read_timeout 90s;
        # Forward Cloudflare Access identity for /admin/auth and session detection.
        proxy_set_header CF-Access-Authenticated-User-Email $http_cf_access_authenticated_user_email;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name opskitpro.com www.opskitpro.com;

    ssl_certificate     /etc/nginx/ssl/opskitpro.com/origin.pem;
    ssl_certificate_key /etc/nginx/ssl/opskitpro.com/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Block non-Cloudflare direct connections
    if ($cloudflare_ip = 0) {
        return 403;
    }

    client_max_body_size 10m;

    # Restore real visitor IP from Cloudflare
    real_ip_header    CF-Connecting-IP;
    real_ip_recursive on;
    set_real_ip_from  173.245.48.0/20;
    set_real_ip_from  103.21.244.0/22;
    set_real_ip_from  103.22.200.0/22;
    set_real_ip_from  103.31.4.0/22;
    set_real_ip_from  141.101.64.0/18;
    set_real_ip_from  108.162.192.0/18;
    set_real_ip_from  190.93.240.0/20;
    set_real_ip_from  188.114.96.0/20;
    set_real_ip_from  197.234.240.0/22;
    set_real_ip_from  198.41.128.0/17;
    set_real_ip_from  162.158.0.0/15;
    set_real_ip_from  104.16.0.0/13;
    set_real_ip_from  104.24.0.0/14;
    set_real_ip_from  172.64.0.0/13;
    set_real_ip_from  131.0.72.0/22;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host                              $host;
        proxy_set_header X-Forwarded-Host                 $host;
        proxy_set_header X-Real-IP                        $remote_addr;
        proxy_set_header X-Forwarded-For                  $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto                https;
        proxy_set_header Upgrade                          $http_upgrade;
        proxy_set_header Connection                       "upgrade";
        proxy_read_timeout 90s;
        # Forward Cloudflare Access identity for /admin/auth and session detection.
        proxy_set_header CF-Access-Authenticated-User-Email $http_cf_access_authenticated_user_email;
    }
}
